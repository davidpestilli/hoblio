[workspace]
resolver = "2"
members = [
    "crates/hoblio-model",
    "crates/hoblio-serde",
    "crates/hoblio-log",
    "crates/hoblio-runtime",
    "crates/hoblio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["David Souza"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
